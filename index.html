<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PizChat AI</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
#top{background:#009900;color:white;padding:15px;text-align:center;font-weight:bold}
#chat{padding:15px;padding-bottom:120px}
.me{background:white;padding:10px;border-radius:10px;margin:10px 0;margin-left:40px}
.ai{background:#e6ffe6;padding:10px;border-radius:10px;margin:10px 0;margin-right:40px}
#box{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;padding:10px;gap:8px}
#q{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;font-size:16px}
#sendBtn{background:#009900;color:white;border:none;padding:12px 20px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<div id="top">PizChat AI - Ask Me Anything</div>
<div id="chat"><div class="ai">Hello boss! I be PizChat AI. Ask me anything.</div></div>
<div id="box"><input id="q" placeholder="Ask anything..."><button id="sendBtn">Send</button></div>
<script>
function send(){
  var input = document.getElementById('q');
  var text = input.value.trim();
  if(!text) return;
  var chat = document.getElementById('chat');
  chat.innerHTML += '<div class="me">'+text+'</div>';
  input.value = '';
  chat.innerHTML += '<div class="ai">I hear you boss! You say: '+text+' — Button don work now!</div>';
  window.scrollTo(0, document.body.scrollHeight);
}
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Enter'){ send(); } });
</script>
</body>
</html>
