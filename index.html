<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PizChat AI</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:10px}
#chat{display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.me{background:#a3e635;color:#000;align-self:flex-end;padding:10px 14px;border-radius:18px;max-width:85%}
.ai{background:#222;padding:10px 14px;border-radius:18px;max-width:85%}
#bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#000}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}
button{padding:12px 18px;border-radius:50%;border:none;background:#a3e635;font-size:18px}
</style></head>
<body>
<h2>PizChat AI</h2>
<div id="chat"><div class="ai">Good evening, Mia ✨ How can I help today?</div></div>
<div id="bar"><input id="q" placeholder="Ask anything..."><button id="send">></button></div>
<script>
let history = [];
let busy = false;
async function send(){
  if(busy) return;
  let input = document.getElementById('q');
  let text = input.value.trim();
  if(!text) return;
  let chat = document.getElementById('chat');
  chat.innerHTML += '<div class="me">'+text+'</div>';
  history.push({role:'user', content:text});
  input.value='';
  busy = true;
  let think = document.createElement('div');
  think.className='ai'; think.textContent='Thinking...';
  chat.appendChild(think);
  chat.scrollTop = chat.scrollHeight;
  try{
    let r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text, history:history})});
    let d = await r.json();
    let ans = d.answer || 'No answer';
    think.textContent = ans;
    history.push({role:'assistant', content:ans});
  }catch(e){ think.textContent='Network error, try again'; }
  busy = false;
}
document.getElementById('send').onclick = send;
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
</script>
</body></html>
