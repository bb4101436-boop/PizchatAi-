<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PizChat AI - Built by PizChat</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:10px}
body.light{background:#f5f5f5;color:#000}
body.light .ai{background:#e5e5e5;color:#000}
body.light #bar{background:#f5f5f5}
body.light input, body.light .icon, body.light #top button, body.light #chips button{background:#fff;color:#000;border:1px solid #ddd}
#top{display:flex;justify-content:space-between;align-items:center}
#top button{background:#222;color:#fff;border:none;padding:8px 14px;border-radius:20px}
#top .pencil{font-size:18px;width:42px;height:42px;border-radius:50%;padding:0}
#chat{display:flex;flex-direction:column;gap:10px;padding-bottom:120px}
.me{background:#a3e635;color:#000;align-self:flex-end;padding:10px 14px;border-radius:18px;max-width:85%}
.me img,.ai img{width:100%;border-radius:12px;margin-top:8px}
.ai{background:#222;padding:10px 14px;border-radius:18px;max-width:85%}
.ai pre{background:#000;color:#a3e635;padding:10px;border-radius:10px;overflow-x:auto;white-space:pre-wrap}
#chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#chips button{background:#222;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:20px;font-size:13px}
#sidePopup{display:none;position:fixed;left:10px;bottom:72px;background:#111;border:1px solid #444;border-radius:16px;padding:10px;flex-direction:column;gap:8px;z-index:99;max-width:230px}
#sidePopup button{background:#222;color:#fff;border:1px solid #444;padding:10px;border-radius:12px;text-align:left;font-size:14px}
.transBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.transBtns button{background:#a3e635;color:#000;border:none;padding:8px 10px;border-radius:20px;font-size:12px;font-weight:bold}
#settingsPanel{display:none;position:fixed;left:0;top:0;bottom:0;width:280px;max-width:85%;background:#111;color:#fff;z-index:200;padding:16px;overflow-y:auto;border-right:1px solid #444}
body.light #settingsPanel{background:#fff;color:#000}
#settingsPanel h3{margin-top:0}
.setRow{margin:14px 0}
.setRow label{font-size:13px;color:#aaa;display:block;margin-bottom:6px}
.setRow select{width:100%;padding:10px;border-radius:10px;background:#222;color:#fff;border:1px solid #444}
.setRow button{width:100%;padding:11px;border-radius:10px;border:none;background:#a3e635;color:#000;font-weight:bold;margin-top:8px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150}
#bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#000;align-items:center}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}
.icon{width:42px;height:42px;border-radius:50%;border:none;background:#222;color:#fff;font-size:18px}
#send{background:#a3e635;color:#000}
</style></head>
<body>
<div id="top"><button class="pencil" onclick="openSettings()">✏️</button><h2 style="margin:0">PizChat AI</h2><button onclick="newChat()">+ New Chat</button></div>

<div id="chat">
<div id="chips">
<button onclick="quick('Write a short story for me')">✍️ Write a story</button>
<button onclick="quick('Explain like I am 5')">🧒 Explain like I am 5</button>
<button onclick="quick('Give me a business idea in Nigeria')">💡 Business idea</button>
<button onclick="quick('Help me with my homework')">📚 Homework</button>
</div>
<div class="ai">Hello ✨ How can I help today? Ask question, ask for code, generate image, or upload your photo to change it.</div>
</div>

<div id="sidePopup">
<button onclick="document.getElementById('uploadInput').click()">📸 Upload Photo - Change Clothes / Style</button>
<button onclick="quick('Write a short story for me')">✍️ Write a story</button>
<button onclick="quick('Explain like I am 5')">🧒 Explain like I am 5</button>
<button onclick="quick('Give me a business idea in Nigeria')">💡 Business idea</button>
<button onclick="quick('Help me with my homework')">📚 Homework</button>
<button onclick="quick('Generate image of a beautiful Lagos city at sunset')">🎨 Generate Image</button>
<button onclick="quick('Write HTML code for a login page')">💻 Write Code</button>
<button onclick="togglePopup()">✖️ Close</button>
</div>

<input type="file" id="uploadInput" accept="image/*" hidden onchange="handleUpload(event)">

<div id="overlay" onclick="closeSettings()"></div>
<div id="settingsPanel">
<h3>✏️ Settings</h3>
<p style="font-size:13px;color:#aaa">PizChat AI • Built by PizChat</p>
<div class="setRow"><label>Language</label><select id="setLang" onchange="saveSettings()"><option value="mix">English + Pidgin Mix</option><option value="english">English Only</option><option value="pidgin">Pidgin Only</option></select></div>
<div class="setRow"><label>Answer Style</label><select id="setStyle" onchange="saveSettings()"><option value="normal">Normal</option><option value="short">Short & Sharp</option><option value="detailed">Detailed</option></select></div>
<div class="setRow"><label>Theme</label><select id="setTheme" onchange="saveSettings()"><option value="dark">Dark</option><option value="light">Light</option></select></div>
<div class="setRow"><label>Font Size</label><select id="setFont" onchange="saveSettings()"><option value="15">Normal</option><option value="17">Big</option><option value="13">Small</option></select></div>
<div class="setRow"><button onclick="clearChat()">🗑️ Clear Chat</button><button onclick="newChat();closeSettings()">✨ Start New Chat</button><button onclick="closeSettings()" style="background:#222;color:#fff">Close Settings</button></div>
<p style="font-size:12px;color:#888;text-align:center">PizChat AI • Version 1.0 • Built by PizChat</p>
</div>

<div id="bar">
<button class="icon" onclick="togglePopup()">+</button>
<button class="icon" onclick="mic()">🎤</button>
<input id="q" placeholder="Ask anything, code or image...">
<button class="icon" id="send" onclick="send()">➤</button>
</div>
<script>
let history=[];
let busy=false;
let chipsEl=document.getElementById('chips');
let popup=document.getElementById('sidePopup');
let input=document.getElementById('q');
let lastUploadedImg='';
let settings = JSON.parse(localStorage.getItem('pizchat_settings')||'{"lang":"mix","style":"normal","theme":"dark","font":"15"}');
document.getElementById('setLang').value=settings.lang;
document.getElementById('setStyle').value=settings.style;
document.getElementById('setTheme').value=settings.theme;
document.getElementById('setFont').value=settings.font;
applySettings();
function applySettings(){ document.body.classList.toggle('light', settings.theme==='light'); document.body.style.fontSize=settings.font+'px'; }
function saveSettings(){ settings={lang:document.getElementById('setLang').value, style:document.getElementById('setStyle').value, theme:document.getElementById('setTheme').value, font:document.getElementById('setFont').value}; localStorage.setItem('pizchat_settings', JSON.stringify(settings)); applySettings(); }
function openSettings(){ document.getElementById('settingsPanel').style.display='block'; document.getElementById('overlay').style.display='block'; }
function closeSettings(){ document.getElementById('settingsPanel').style.display='none'; document.getElementById('overlay').style.display='none'; }
function clearChat(){ history=[]; document.getElementById('chat').innerHTML='<div class="ai">Chat cleared ✨ Wetin you wan talk about?</div>'; closeSettings(); }
let today=new Date().toDateString();
let lastDay=localStorage.getItem('pizchat_day');
if(lastDay!==today){ localStorage.setItem('pizchat_day', today); chipsEl.style.display='flex'; } else { chipsEl.style.display='flex'; }
function togglePopup(){ if(popup.style.display==='flex'){ popup.style.display='none'; } else { popup.style.display='flex'; } }
function newChat(){ history=[]; lastUploadedImg=''; document.getElementById('chat').innerHTML='<div id="chips">'+chipsEl.innerHTML+'</div><div class="ai">Fresh chat ✨ Wetin you wan talk about?</div>'; chipsEl=document.getElementById('chips'); chipsEl.style.display='flex'; popup.style.display='none'; closeSettings(); }
function quick(t){ popup.style.display='none'; document.getElementById('q').value=t; send(); }
input.addEventListener('input', ()=>{ if(input.value.trim().length>0){ if(chipsEl) chipsEl.style.display='none'; popup.style.display='none'; } else { if(history.length===0 && chipsEl) chipsEl.style.display='flex'; } });
function mic(){ if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ alert('Mic no work for this browser, use Chrome'); return; } let Rec = window.SpeechRecognition || window.webkitSpeechRecognition; let r = new Rec(); r.lang='en-NG'; r.start(); r.onresult = e=>{ document.getElementById('q').value = e.results[0][0].transcript; send(); }; }

function handleUpload(e){
  let file=e.target.files[0];
  if(!file) return;
  popup.style.display='none';
  if(chipsEl) chipsEl.style.display='none';
  let reader=new FileReader();
  reader.onload=function(ev){
    lastUploadedImg=ev.target.result;
    let chat=document.getElementById('chat');
    chat.innerHTML+='<div class="me">My photo 📸<img src="'+lastUploadedImg+'"></div>';
    let aiDiv=document.createElement('div');
    aiDiv.className='ai';
    aiDiv.innerHTML='I don see your photo ✨ Wetin you want make I do with am? Tap one, or type your own like "change my clothes to Agbada" <div class="transBtns"><button onclick="transformPhoto(\'elegant suit, professional photoshoot\')">👔 Change Clothes - Suit</button><button onclick="transformPhoto(\'beautiful Agbada, Nigerian fashion\')">👘 Agbada</button><button onclick="transformPhoto(\'cartoon style, Pixar 3D\')">🎨 Cartoon</button><button onclick="transformPhoto(\'professional corporate headshot, studio light\')">💼 Professional</button><button onclick="transformPhoto(\'beautiful dress, wedding style\')">✨ Beautiful Dress</button></div>';
    chat.appendChild(aiDiv);
    window.scrollTo(0,document.body.scrollHeight);
  };
  reader.readAsDataURL(file);
  e.target.value='';
}
function transformPhoto(style){
  if(!lastUploadedImg){ alert('Upload photo first'); return; }
  let chat=document.getElementById('chat');
  let div=document.createElement('div');
  div.className='ai';
  div.textContent='Creating your new look: '+style+' ...';
  chat.appendChild(div);
  window.scrollTo(0,document.body.scrollHeight);
  let prompt = 'Portrait photo of a person, ' + style + ', high quality, realistic, beautiful lighting';
  let imgUrl = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=512&height=512&seed=' + Math.floor(Math.random()*99999) + '&nologo=true';
  setTimeout(()=>{
    div.innerHTML='Here is your new look ✨<br>Original photo:<br><img src="'+lastUploadedImg+'"><br>New version - '+style+':<br><img src="'+imgUrl+'"><br><div class="transBtns"><button onclick="transformPhoto(\'elegant suit\')">👔 Try Suit</button><button onclick="transformPhoto(\'cartoon Pixar\')">🎨 Try Cartoon</button><button onclick="transformPhoto(\'Agbada Nigerian\')">👘 Try Agbada</button></div><small>Tip: Type your own - e.g. "Change my clothes to red gown"</small>';
    window.scrollTo(0,document.body.scrollHeight);
  },800);
}
function isImageRequest(t){ t=t.toLowerCase(); return t.includes('generate image')||t.includes('create image')||t.includes('draw')||t.includes('picture of')||t.includes('generate picture')||t.includes('make an image'); }
function isCodeRequest(t){ t=t.toLowerCase(); return t.includes('code')||t.includes('html')||t.includes('python')||t.includes('javascript')||t.includes('website')||t.includes('app code')||t.includes('write a program'); }
function isPhotoEditRequest(t){ t=t.toLowerCase(); return (t.includes('change my clothes')||t.includes('change clothes')||t.includes('make me cartoon')||t.includes('make my photo')||t.includes('my photo')||t.includes('my picture')) && lastUploadedImg; }

async function send(){
  if(busy) return;
  let text=input.value.trim();
  if(!text) return;
  let chat=document.getElementById('chat');
  if(chipsEl) chipsEl.style.display='none';
  popup.style.display='none';
  chat.innerHTML+='<div class="me">'+text+'</div>';
  history.push({role:'user',content:text});
  input.value='';
  busy=true;
  let think=document.createElement('div');
  think.className='ai'; think.textContent='Thinking...';
  chat.appendChild(think);
  window.scrollTo(0,document.body.scrollHeight);

  if(isPhotoEditRequest(text)){
    let prompt = 'Portrait photo of a person, ' + text + ', high quality, realistic';
    let imgUrl = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=512&height=512&seed=' + Math.floor(Math.random()*99999) + '&nologo=true';
    think.innerHTML='Done ✨ Based on your photo, here is: '+text+'<br><img src="'+imgUrl+'">';
    busy=false; return;
  }
  if(isImageRequest(text)){
    let prompt = text.replace(/generate image of|generate image|create image of|create image|draw|picture of|make an image of/gi,'').trim() || text;
    let imgUrl = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=512&height=512&seed=' + Math.floor(Math.random()*9999) + '&nologo=true';
    think.innerHTML = 'Here is your image ✨<br><img src="'+imgUrl+'" onload="window.scrollTo(0,document.body.scrollHeight)"><br><small>'+prompt+'</small>';
    history.push({role:'assistant',content:'Generated image: '+prompt});
    busy=false; return;
  }
  let langText = settings.lang==='pidgin' ? ' Answer in Nigerian Pidgin only.' : settings.lang==='english' ? ' Answer in clear English only.' : ' Answer in English + Pidgin mix like PizChat.';
  let styleText = settings.style==='short' ? ' Keep answer very short.' : settings.style==='detailed' ? ' Give detailed full explanation.' : ' Give normal clear answer.';
  let extra = '';
  if(isCodeRequest(text)){ extra = ' You are an expert coder. Give complete working code, with explanation. Put code in code block. Do not cut code.'; }
  else { extra = ' You can answer any question, write anything, help with anything.'; }
  let finalMsg = text + langText + styleText + extra;
  try{
    let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:finalMsg,history:history})});
    let d=await res.json();
    let ans=d.answer||'No answer';
    ans = ans.replace(/```/g,'<pre>');
    think.innerHTML=ans;
    history.push({role:'assistant',content:ans});
  }catch(e){ think.textContent='Network error, try again'; }
  busy=false;
}
input.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
document.addEventListener('click',e=>{ if(!e.target.closest('#sidePopup') && !e.target.closest('.icon')){ popup.style.display='none'; } });
</script>
</body></html>
