<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding-bottom:80px}
header{padding:16px;font-size:22px;font-weight:700}
.cards{display:flex;gap:10px;padding:0 16px;overflow:auto}
.card{background:#1a1a1a;padding:12px;border-radius:14px;min-width:140px;font-size:14px}
#chat{padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.5;font-size:15px}
.user{background:#a3e635;color:#000;align-self:flex-end}
.ai{background:#1e1e1e;align-self:flex-start}
.input-bar{display:flex;align-items:center;gap:8px;padding:10px;background:#111;position:fixed;bottom:0;left:0;right:0}
.input-wrap{flex:1;display:flex;align-items:center;gap:6px;background:#222;border-radius:25px;padding:5px 8px}
.input-wrap input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font-size:16px;padding:10px 4px}
.plus,.mic{width:36px;height:36px;border:none;border-radius:50%;background:#333;color:#fff;font-size:16px;flex-shrink:0}
.send{width:46px;height:46px;min-width:46px;border:none;border-radius:50%;background:#a3e635;font-size:18px;flex-shrink:0}
</style></head>
<body>
<header>PizChat AI</header>
<div class="cards">
<div class="card" onclick="ask('Draft an email for me')">Draft an email for me</div>
<div class="card" onclick="ask('Create a study plan')">Create a study plan</div>
<div class="card" onclick="ask('Brainstorm creative ideas')">Brainstorm ideas</div>
</div>
<div id="chat"><div class="msg ai">Good evening, Mia ✨ How can I help today?</div></div>

<div class="input-bar">
<div class="input-wrap">
<button class="plus" onclick="alert('Plus: Photo / Clear Chat')">+</button>
<input id="inp" placeholder="Ask anything...">
<button class="mic" onclick="startMic()">🎙️</button>
</div>
<button class="send" onclick="send()">➤</button>
</div>

<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
function ask(t){inp.value=t;send()}
async function send(){
let q=inp.value.trim();if(!q)return;
chat.innerHTML+=`<div class="msg user">${q}</div>`;inp.value='';
chat.innerHTML+=`<div class="msg ai" id="tmp">Thinking...</div>`;
try{
let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
let d=await r.json();
let ans=d.answer||d.reply||d.text||d.response||(d.choices&&d.choices[0].message.content)||'No answer';
document.getElementById('tmp').textContent=ans;
}catch(e){document.getElementById('tmp').textContent='Real error: '+e.message;}
window.scrollTo(0,document.body.scrollHeight);
}
function startMic(){alert('Mic: Hold to talk - coming soon');}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body></html>
